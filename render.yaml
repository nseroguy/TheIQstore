services:
  - type: web
    name: the-iq-store
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: iqstore-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: iqstore-postgres
    plan: starter
    databaseName: iqstore
    user: iquser